name: Deploy demo to GitHub Pages

# One un-versioned gh-pages branch, always rebuilt from the latest master.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # The historical lockfile pins Angular 18 while package.json asks for
        # 22, so npm ci cannot be used here.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build libraries and demo
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ./build.sh
          ng build angular2-json-schema-form-demo \
            --configuration production \
            --base-href /angular2-json-schema-form/
          touch dist/demo/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/demo
          publish_branch: gh-pages
          force_orphan: true
